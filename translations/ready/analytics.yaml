sw:
    analytics.consent.title: "Upimaji wa hiari wa hadhira"
    analytics.consent.message: "Tusaidie kuelewa jinsi wageni waliotoa idhini wanavyotumia BeWelcome. Google Analytics hupakiwa tu ukiiruhusu. Tunatuma tu maonyesho ya kurasa yenye majina bandia ya kurasa, kamwe si anwani halisi za kurasa, maneno ya utafutaji, ujumbe, maelezo ya wasifu au vitambulisho vya BeWelcome."
    analytics.consent.allow: "Ruhusu uchanganuzi"
    analytics.consent.reject: "Kataa uchanganuzi"
    analytics.consent.privacy: "Soma sera ya faragha"
    analytics.settings.open: "Mipangilio ya vidakuzi"
    analytics.settings.description: "Vidakuzi muhimu huwezesha vipengele vya BeWelcome. Google Analytics ya hiari hutumiwa tu baada ya idhini yako, na unaweza kubadilisha chaguo lako hapa wakati wowote."
    analytics.settings.status.label: "Chaguo la sasa la uchanganuzi"
    analytics.settings.status.granted: "Imeruhusiwa"
    analytics.settings.status.denied: "Imekataliwa"
    analytics.settings.status.unset: "Hakuna chaguo lililohifadhiwa"
    analytics.settings.withdraw: "Ondoa idhini ya uchanganuzi"
    analytics.settings.close: "Funga"
tr:
    analytics.consent.title: "İsteğe bağlı kitle ölçümü"
    analytics.consent.message: "Onay veren ziyaretçilerin BeWelcome’u nasıl kullandığını anlamamıza yardımcı olun. Google Analytics yalnızca izin verirseniz yüklenir. Yalnızca yapay sayfa adlarıyla sayfa görüntülemeleri göndeririz; gerçek sayfa adreslerini, arama terimlerini, mesajları, profil ayrıntılarını veya BeWelcome tanımlayıcılarını hiçbir zaman göndermeyiz."
    analytics.consent.allow: "Analitiğe izin ver"
    analytics.consent.reject: "Analitiği reddet"
    analytics.consent.privacy: "Gizlilik politikasını okuyun"
    analytics.settings.open: "Çerez ayarları"
    analytics.settings.description: "Gerekli çerezler BeWelcome özelliklerini destekler. İsteğe bağlı Google Analytics yalnızca onayınızdan sonra kullanılır ve seçiminizi burada istediğiniz zaman değiştirebilirsiniz."
    analytics.settings.status.label: "Geçerli analitik seçimi"
    analytics.settings.status.granted: "İzin verildi"
    analytics.settings.status.denied: "Reddedildi"
    analytics.settings.status.unset: "Kaydedilmiş seçim yok"
    analytics.settings.withdraw: "Analitik onayını geri çek"
    analytics.settings.close: "Kapat"
zh-hans:
    analytics.consent.title: "可选的受众统计"
    analytics.consent.message: "请帮助我们了解已同意的访客如何使用 BeWelcome。只有在您允许后，Google Analytics 才会加载。我们只会发送使用合成页面名称的页面浏览量，绝不会发送真实页面地址、搜索词、消息、个人资料详情或 BeWelcome 标识符。"
    analytics.consent.allow: "允许分析"
    analytics.consent.reject: "拒绝分析"
    analytics.consent.privacy: "阅读隐私政策"
    analytics.settings.open: "Cookie 设置"
    analytics.settings.description: "必要 Cookie 用于支持 BeWelcome 的功能。可选的 Google Analytics 仅在您同意后使用，您可以随时在此更改选择。"
    analytics.settings.status.label: "当前分析选择"
    analytics.settings.status.granted: "已允许"
    analytics.settings.status.denied: "已拒绝"
    analytics.settings.status.unset: "尚未保存选择"
    analytics.settings.withdraw: "撤回分析同意"
    analytics.settings.close: "关闭"
zh-hant:
    analytics.consent.title: "選用的受眾統計"
    analytics.consent.message: "請協助我們瞭解已同意的訪客如何使用 BeWelcome。只有在您允許後，Google Analytics 才會載入。我們只會傳送使用合成頁面名稱的網頁瀏覽量，絕不會傳送真實頁面位址、搜尋詞、訊息、個人資料詳情或 BeWelcome 識別碼。"
    analytics.consent.allow: "允許分析"
    analytics.consent.reject: "拒絕分析"
    analytics.consent.privacy: "閱讀隱私權政策"
    analytics.settings.open: "Cookie 設定"
    analytics.settings.description: "必要 Cookie 用於支援 BeWelcome 的功能。選用的 Google Analytics 僅在您同意後使用，您可以隨時在此變更選擇。"
    analytics.settings.status.label: "目前的分析選擇"
    analytics.settings.status.granted: "已允許"
    analytics.settings.status.denied: "已拒絕"
    analytics.settings.status.unset: "尚未儲存選擇"
    analytics.settings.withdraw: "撤回分析同意"
    analytics.settings.close: "關閉"
hy:
    analytics.consent.title: "Լսարանի ընտրովի չափում"
    analytics.consent.message: "Օգնեք մեզ հասկանալ, թե համաձայնություն տված այցելուներն ինչպես են օգտվում BeWelcome-ից։ Google Analytics-ը բեռնվում է միայն ձեր թույլտվությամբ։ Մենք ուղարկում ենք միայն էջերի դիտումներ՝ էջերի արհեստական անուններով, բայց երբեք չենք ուղարկում էջերի իրական հասցեներ, որոնման բառեր, հաղորդագրություններ, պրոֆիլի տվյալներ կամ BeWelcome-ի նույնացուցիչներ։"
    analytics.consent.allow: "Թույլատրել վերլուծությունը"
    analytics.consent.reject: "Մերժել վերլուծությունը"
    analytics.consent.privacy: "Կարդալ գաղտնիության քաղաքականությունը"
    analytics.settings.open: "Cookie-ների կարգավորումներ"
    analytics.settings.description: "Անհրաժեշտ cookie-ներն ապահովում են BeWelcome-ի գործառույթները։ Ընտրովի Google Analytics-ն օգտագործվում է միայն ձեր համաձայնությունից հետո, և այստեղ կարող եք ցանկացած պահի փոխել ձեր ընտրությունը։"
    analytics.settings.status.label: "Վերլուծության ընթացիկ ընտրություն"
    analytics.settings.status.granted: "Թույլատրված է"
    analytics.settings.status.denied: "Մերժված է"
    analytics.settings.status.unset: "Ընտրություն պահպանված չէ"
    analytics.settings.withdraw: "Հետ վերցնել վերլուծության համաձայնությունը"
    analytics.settings.close: "Փակել"
